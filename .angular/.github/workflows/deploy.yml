name: Deploy Angular App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Angular bauen
        run: npm run build -- --base-href=/LernwoerterQuiz/

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: GitHub Pages deployen
        uses: actions/deploy-pages@v4